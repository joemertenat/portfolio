<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Portfolio — Single Project</title>

  <!-- Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  

  <style>


/* =========================================================
   CLEAN FULL CSS (desktop experience + unified overlay)
   - Removes #mobile-soon and #tablet-rotate systems
   - Removes nested @media + fixes missing braces
   - Keeps your existing layout/styles intact
   - Adds ONE unified non-desktop overlay: #device-soon
   - Keeps custom cursor on desktop, disables it on touch
========================================================= */

:root{
  --bg: #0f1012;
  --ink: #0a0a0a;
  --panelBorder: rgba(0,0,0,0.12);

  --titleColor: #000000;

  --indexOverlayBg: rgba(0,0,0,0.55);
  --indexPanelBg: #ffffff;
  --indexPanelText: #000000;
  --indexPanelSub: #6b6b6b;

  --indexItemBg: #ffffff;
  --indexItemBorder: rgba(0,0,0,0.12);
  --indexItemText: #000000;
  --indexItemBgHover: #3a3a3a;
  --indexItemTextHover: #ffffff;
  --indexItemBorderHover: rgba(0,0,0,0);

  --ctaBg: rgba(255,255,255,1);
  --ctaText: #000000;
  --ctaBorder: rgba(0,0,0,0.15);
  --ctaBgHover: #e0e0e0;
  --ctaTextHover: #000000;

  --indexBtnBg: #ffffff;
  --indexBtnText: #000000;
  --indexBtnBorder: rgba(0,0,0,0.15);
  --indexBtnBgHover: #dcdcdc;
  --indexBtnTextHover: #000000;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }

body{
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden; /* we scroll inside .scroller */
  font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 400;
}

.hud { display: none !important; }

/* =========================================================
   SCROLLER + SLIDES
========================================================= */
.scroller{
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}

.slide{
  position: relative;
  height: 100dvh;
  width: 100%;
  background: #fafafa;
  color: #000000;
  scroll-snap-align: start;
  isolation: isolate;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

/* Full-screen stage for media slides */
.stage{
  position: relative;
  width: 100vw;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.stage img,
.stage video{
  width: 100%;
  height: 100%;
  max-width: 100vw;
  max-height: 100dvh;
  object-fit: contain;
  object-position: center;
  display: block;
}

.video-wrapper{
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: none;
}

.video-wrapper video{
  width: 105%;
  height: 105%;
  padding-top: 12vh;
  object-fit: contain;
  object-position: center;
  max-width: 105%;
  max-height: 105%;
  display: block;
}

/* Slide title overlay */
.slide-title{
  position: absolute;
  top: 2rem;
  left: 2rem;
  z-index: 20;
  max-width: 120ch;
  pointer-events: none;
  white-space: pre-line;
  color: var(--titleColor);
  background: transparent;
  border: none;
  padding: 0;
}

.slide-title .title-main{
  display: block;
  font-weight: 500;
  font-size: 20px;
  line-height: 1.3;
  color: var(--titleColor);
}

.slide-title .title-sub{
  display: block;
  margin-top: .5rem;
  font-weight: 400;
  font-size: 14px;
  line-height: 1.3;
  color: var(--titleColor);
  white-space: pre-line;
}

/* =========================================================
   INTRO SLIDE
========================================================= */
.slide.intro-slide{
  background:#fcfcfc;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 12vw;
}

.intro-inner{
  max-width: 1280px;
  width: 100%;
  text-align: center;
}

/* Typographic fixes (your original clamps had min > max) */
.intro-main{
  margin: 0 0 1.1rem 0;
  font-weight: 500;
  font-size: clamp(44px, 4vw, 46px);
  line-height: 1.5;
  white-space: pre-wrap;
  background: #000000;
  -webkit-background-clip: text;
  color: transparent;
}

.intro-sub{
  margin: 0;
  font-weight: 500;
  font-size: clamp(30px, 2.6vw, 50px);
  line-height: 1.5;
  white-space: pre-wrap;
  background: #000000;
  -webkit-background-clip: text;
  color: transparent;
}

/* Intro layout + contact block */
.intro-slide .intro-inner{
  max-width: 1180px;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.intro-slide .intro-header{
  margin-top: 2.5rem;
}

.intro-slide .contact-header{
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 1rem;
  justify-content: center;
}

.intro-slide .contact-header-text{
  display: flex;
  flex-direction: column;
  text-align: left;
  align-items: flex-start;
}

.intro-slide .contact-avatar{ width: 72px; height: 72px; }
.intro-slide .contact-name{ font-size: 22px; }
.intro-slide .contact-title{ font-size: 14px; }

/* Intro animation hooks */
.intro-main,
.intro-sub{
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 0.6s ease-out, transform 0.9s ease-out;
}

.intro-header{
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.6s ease-out, transform 0.9s ease-out;
}

.slide.intro-slide.is-visible .intro-main{
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.0s;
}

.slide.intro-slide.is-visible .intro-sub{
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.2s;
}

.slide.intro-slide.is-visible .intro-header{
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.4s;
}

.intro-header{
  margin-top: 2.5rem;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .4s ease, transform .4s ease;
}

.intro-header.is-visible{
  opacity: 1;
  transform: translateY(0);
}

.intro-inner{
  max-width: 60vw;
  margin: 0 auto;
}

/* =========================================================
   SOLUTIONS SLIDE
========================================================= */
.slide.solutions-slide{
  background:#fcfcfc;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding: 0 1vw;
}

.solutions-inner{
  width: 100%;
  max-width: none;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  margin: 0;
}

.solutions-track{
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  padding-top: 2vh;
  padding-bottom: 1vh;
  margin-bottom: 1vh;
  scroll-snap-type: x mandatory;
}

.solutions-track::-webkit-scrollbar{ height: 6px; }
.solutions-track::-webkit-scrollbar-thumb{
  background: #a8a8a8;
  border-radius: 999px;
}

.solution-item{
  display: flex;
  flex-direction: column;
  gap: 1vh;
  flex: 0 0 calc(100% - 4vw);
  max-width: 1100px;
  height: 85vh;
  scroll-snap-align: start;
  margin-right: 2rem;
}

.solution-item:last-child{ margin-right: 0; }

.solution-title{
  margin: 0;
  padding: 0;
  font-weight: 300;
  font-size: 14px;
  color: rgba(0, 0, 0, 0.45);
}

.solution-stage{
  flex: 1;
  width: 100%;
  margin: 0;
  background: #fafafa;
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 0;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  padding-top: 0vh;
}

.solution-stage img,
.solution-stage video{
  width: 100%;
  height: 115%;
  object-fit: contain;
  object-position: center;
  display: block;
}

@media (max-width: 900px){
  .solution-item{
    min-width: 95vw;
    height: 68vh;
  }
  .solution-title{ font-size: 14px; }
}

/* Video timeline + controls */
.solution-video-bar{
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: 14px;
  display: flex;
  align-items: center;
}

.solution-video-progress{
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: rgba(0,0,0,0.12);
  position: relative;
  overflow: visible;
  pointer-events: auto;
}

.solution-video-controls{
  display: flex;
  gap: 6px;
  margin-left: 5px;
  align-items: center;
  pointer-events: auto;
}

.solution-video-progress-fill{
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: inherit;
  background: #111;
  transform-origin: left center;
  transform: scaleX(0);
  transition: transform 0.15s linear;
}

.solution-video-progress-handle{
  position: absolute;
  top: 50%;
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: #111;
  transform: translate(-50%, -50%);
  transition: left 0.15s linear, transform 0.15s ease-out;
}

.solution-video-btn{
  width: 14px;
  height: 14px;
  background: none;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 8px;
  line-height: 1;
  color: #000;
  cursor: none;
  opacity: 0.9;
  transition: opacity 0.2s;
}

.solution-video-btn:hover{ opacity: 1; }

/* =========================================================
   SKILLS SLIDE
========================================================= */
.slide.skills-slide{
  background: #fcfcfc;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 0;
  position: relative;
  height: 100vh;
}

.skills-inner{
  max-width: 1500px;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 2rem;
  padding: 45vh 8vw 0;
  box-sizing: border-box;
}

.skills-grid{
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1.6rem;
}

.skills-column{
  background: #ffffff;
  border-radius: 0.8vh;
  border: 1px solid rgba(0,0,0,0.06);
  padding: 1.2rem 1.4rem;
  box-shadow: 0 10px 26px rgba(0,0,0,0.04);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: box-shadow 0.25s ease, border-color 0.25s ease, max-height 0.35s ease;
  max-height: 3.4rem;
}

.skills-column:hover{
  transform: none;
  box-shadow: 0 14px 40px rgba(0,0,0,0.06);
  border-color: rgba(0,0,0,0.12);
  max-height: 380px;
}

.skills-column-title{
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: #111;
}

.skills-column-list{
  margin: 1rem 0 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.skills-column-item{
  position: relative;
  padding-left: 1.1rem;
  font-size: 12px;
  font-weight: 300;
  line-height: 1.5;
  color: #111;
}

.skills-column-item::before{
  content: '';
  position: absolute;
  left: 0;
  top: 0.7em;
  width: 4px;
  height: 4px;
  border-radius: 999px;
  background: #111;
  opacity: 0.7;
}

/* Diagram mode */
.skills-diagram-container{
  width: 100vw;
  height: 100vh;
  border: none;
  border-radius: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}

.skills-diagram-svg{
  width: 100%;
  height: 100%;
  display: block;
}

.skills-diagram-links line{
  stroke: #ffffff;
  stroke-width: 1;
  stroke-opacity: 0.7;
}

.skills-diagram-label{
  fill: #ffffff;
  font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 11px;
  pointer-events: auto;
}

.skills-diagram-label.category{
  font-size: 13px;
  font-weight: 500;
}

.skills-slide.skills-diagram-mode{
  background: #292929;
  align-items: center;
}

.skills-slide.skills-diagram-mode .skills-inner{
  padding-top: 0;
  padding-bottom: 0;
  justify-content: center;
  align-items: center;
}

/* Skills button */
.skills-topbar{
  position: absolute;
  top: 47.9%;
  right: 2vw;
  transform: translateY(-50%);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.skills-mode-btn{
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  border: 1px solid rgba(0,0,0,0.4);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  cursor: none;
}

.skills-mode-btn svg{
  width: 18px;
  height: 18px;
  stroke: #fff;
  stroke-width: 1.6;
  fill: none;
}

.skills-mode-btn svg circle{
  fill: #fff;
  stroke-width: 1;
}

/* Skills responsive grid */
@media (max-width: 1100px){
  .skills-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 800px){
  .skills-grid{ grid-template-columns: 1fr; }
}

/* Tablet landscape skills tweak */
@media (min-width: 768px) and (max-width: 1366px) and (orientation: landscape){
  .slide.skills-slide{
    padding: 0;
    align-items: flex-start;
    justify-content: center;
  }
  .skills-inner{
    max-width: 1180px;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    gap: 2rem;
    padding-top: 26vh;
    padding-bottom: 0;
  }
}

/* =========================================================
   TEXT BLOCKS + RESULTS
========================================================= */
.slide.results-slide{
  background: #fcfcfc;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6vh 10vw 10vh 10vw;
}

.text-block-inner{
  max-width: 980px;
  width: 100%;
  text-align: left;
}

.text-block-label{
  font-weight: 300;
  font-size: 14px;
  text-transform: none;
  color: rgba(0, 0, 0, 0.45);
  margin: 0 0 1.75rem 0;
}

.text-block-title{
  font-weight: 500;
  font-size: clamp(30px, 4vw, 30px);
  line-height: 1.05;
  color: #000000;
  margin: 0 0 1.8rem 0;
}

.text-block-body{
  font-weight: 400;
  font-size: clamp(18px, 1.4vw, 22px);
  line-height: 1.7;
  color: #111111;
  max-width: 56rem;
  margin: 0;
}

.text-block-slide .scroll-hint{
  margin-top: 3.5rem;
}

.results-slide{ position: relative; }

.results-inner{
  max-width: 1100px;
  width: 100%;
  text-align: left;
}

.results-label{
  font-weight: 300;
  font-size: 14px;
  color: rgba(0, 0, 0, 0.45);
  margin: 0 0 1.75rem 0;
}

.results-title{
  font-weight: 500;
  font-size: clamp(30px, 4vw, 30px);
  line-height: 1.05;
  color: #000000;
  margin: 0 0 1.8rem 0;
}

.results-grid{
  display: flex;
  flex-direction: column;
  gap: 1.8rem;
  margin: 0;
  padding: 0;
}

.result-item{
  display: flex;
  align-items: flex-start;
  gap: 0.9rem;
  max-width: 900px;
}

.result-line{
  width: 12px;
  height: 12px;
  border-radius: 999px;
  margin-top: 0.45rem;
  flex-shrink: 0;
}

.result-line-success{ background: #20d450; }
.result-line-improve{ background: #ff8a1e; }

.result-text{
  font-weight: 400;
  font-size: 16px;
  line-height: 1.7;
  color: #111111;
  margin: 0;
}

.result-text-inner{ display: inline-block; }

/* Results navigation */
.results-nav{
  position: absolute;
  bottom: 5vh;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 1.5rem;
  justify-content: center;
  align-items: center;
}

.results-nav-btn{
  appearance:none;
  -webkit-appearance:none;
  border-radius:999px;
  border:1px solid rgba(0,0,0,0.16);
  font-size:13px;
  font-weight:500;
  padding:.55rem 1.15rem;
  box-shadow:0 10px 28px rgba(0,0,0,0.16);
  background:#111111;
  color:#ffffff;
  cursor:none;
  transition: background-color .15s ease, color .15s ease, box-shadow .15s ease, transform .12s ease;
}

.results-nav-btn:hover,
.results-nav-btn:focus-visible{
  background:#222222;
  color:#ffffff;
  box-shadow:0 14px 38px rgba(0,0,0,0.22);
  transform: translateY(-1px);
  outline:none;
}

.results-nav-btn.secondary{
  background:#ffffff;
  color:#111111;
}

.results-nav-btn.secondary:hover,
.results-nav-btn.secondary:focus-visible{
  background:#f4f4f4;
  color:#000000;
}

.results-nav-btn.back-btn{
  background: #f0f0f0;
  color: #222;
  border: 1px solid #ccc;
}

.results-nav-pill{
  display: flex;
  gap: 1.1rem;
}

/* Scroll hint */
.scroll-hint{
  position: absolute;
  bottom: 6vh;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.95rem;
  color: #999;
  opacity: 0.9;
  text-align: center;
  pointer-events: none;
  animation: hintFade 4s ease-in-out infinite;
}

@keyframes hintFade{
  0%{ opacity: 0.4; }
  50%{ opacity: 1; }
  100%{ opacity: 0.4; }
}

/* =========================================================
   PROJECT INTRO PAGE (50/50)
========================================================= */
.slide.project-intro{
  background:#fcfcfc;
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:0;
}

.project-intro-inner{
  display:flex;
  flex-direction:row;
  width:100%;
  height:100%;
}

.project-intro-inner *{
  box-sizing:border-box;
  margin:0;
}

.project-intro-text{
  width:50%;
  height:100%;
  padding:35vh 6vw;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:2.4vh;
}

.project-intro-image{
  width:50%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:#e5e5e5;
}

.project-intro-img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

.project-intro-title{
  font-weight:500;
  font-size:clamp(22px, 2.6vw, 30px);
  line-height:1.2;
  white-space:pre-wrap;
  color:#000;
}

.project-meta{
  margin-top:1.2vh;
  margin-bottom:2.4vh;
  width:100%;
  display:flex;
  justify-content:flex-start;
}

.project-meta-inline{
  display:flex;
  flex-wrap:wrap;
  gap:0.9rem;
  align-items:center;
}

.project-meta-item,
.project-meta-sep{
  font-size:14px;
  font-weight:500;
  line-height:1.2;
  color:#000;
}

.project-meta-sep{ opacity:0.5; }

.project-intro-body{
  font-size:15px;
  line-height:1.5;
  color:#111;
  max-width:40rem;
}

/* You hide this list anyway */
.project-intro-list{
  display: none !important;
}

/* Tablet landscape tweak (kept) */
@media (min-width:768px) and (max-width:1366px) and (orientation:landscape){
  .project-intro-text{ padding:6vh 5vw; }
}

/* =========================================================
   PROJECTS OVERVIEW (horizontal scroll cards)
========================================================= */
.slide.projects-overview{
  background: #fcfcfc;
}

.projects-overview-inner{
  max-width: 100vw;
  max-height: 100vh;
  margin: 0 auto;
  padding: 6vh 3vw;
  overflow-x: auto;
  overflow-y: visible;
  scrollbar-width: thin;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.projects-overview-inner::-webkit-scrollbar{ display: none; }

.projects-grid{
  display: flex;
  flex-wrap: nowrap;
  justify-content: flex-start;
  gap: 1vw;
}

.projects-grid::after{
  content: '';
  flex: 0 0 0.5vw;
}

.project-card{
  flex: 0 0 calc(25% - 2vw);
  min-width: 0;
  min-height: 65vh;
  position: relative;
  padding: 3vh 2vw;
  overflow: hidden;
  border-radius: 0.8vh;
  background: #ffffff;
  border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 0.6vh 1.2vh rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  transition: transform .25s ease, box-shadow .25s ease;
}

.project-card:hover{
  transform: translateY(-0.8vh);
  box-shadow: 0 1.2vh 2.2vh rgba(0,0,0,0.14);
  background: #ECECEC;
  border-color: rgba(0,0,0,0.12);
}

.project-card-title{
  font-size: 1rem;
  line-height: 1.3;
  font-weight: 500;
  color: #1a1a1a;
  margin: 0 0 1vh;
}

    function buildTitleNode(rawTitle){
      const box = document.createElement('div');
      box.className = 'slide-title';
      const parts = (rawTitle || '').split('\n');
      const mainLine = parts.shift() || '';
      const rest = parts.join('\n');

      const mainSpan = document.createElement('span');
      mainSpan.className = 'title-main';
      mainSpan.textContent = mainLine;
      box.appendChild(mainSpan);

      if (rest.trim() !== '') {
        const subSpan = document.createElement('span');
        subSpan.className = 'title-sub';
        subSpan.textContent = rest;
        box.appendChild(subSpan);
      }
      return box;
    }

      progressHandle.className = 'solution-video-progress-handle';

      progress.appendChild(progressFill);
      progress.appendChild(progressHandle);

      // --- SMALL PAUSE + RESTART BUTTONS ---
      const controls = document.createElement('div');
      controls.className = 'solution-video-controls';

      // pause toggle ( ❚❚ / ▶ )
      const pauseBtn = document.createElement('div');
      pauseBtn.className = 'solution-video-btn';

      // restart ( ↺ )

      restartBtn.className = 'solution-video-btn';
      restartBtn.textContent = '↺';

      controls.appendChild(pauseBtn);

      const barRow = document.createElement('div');
      barRow.className = 'solution-video-bar';
      barRow.appendChild(progress);
      barRow.appendChild(controls);

      // attach the row at the bottom of the stage
      stage.appendChild(barRow);

      // --- SMOOTH UI UPDATE ---
      const updateProgressUI = () => {
        if (!vid.duration || isNaN(vid.duration)) return;
        const ratio = Math.min(Math.max(vid.currentTime / vid.duration, 0), 1);
        progressFill.style.transform = `scaleX(${ratio})`;
        progressHandle.style.left = `${ratio * 100}%`;
      };

      // animation loop for ultra-smooth cursor
      let frameId = null;

      const stopLoop = () => {
        if (frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
      };

      const loop = () => {
        updateProgressUI();
        frameId = requestAnimationFrame(loop);
      };

      vid.addEventListener('play', () => {
        stopLoop();
        loop();
      });

      vid.addEventListener('pause', stopLoop);
      vid.addEventListener('ended', stopLoop);
      vid.addEventListener('loadedmetadata', updateProgressUI);

      // --- INTERACTIVE SCRUBBING ---
      let isScrubbing = false;
      let wasPlayingBeforeScrub = false;

      const seekFromClientX = (clientX) => {
        if (!vid.duration || isNaN(vid.duration)) return;
        const rect = progress.getBoundingClientRect();
        if (!rect.width) return;
        const ratio = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
        vid.currentTime = ratio * vid.duration;
        updateProgressUI();
      };

      progress.addEventListener('pointerdown', (ev) => {
        isScrubbing = true;
        wasPlayingBeforeScrub = !vid.paused;
        vid.pause();

        if (progress.setPointerCapture) {
          progress.setPointerCapture(ev.pointerId);
        }
        seekFromClientX(ev.clientX);

        if (typeof setCursorSolid === 'function') {
          setCursorSolid(true);
        }
      });

      progress.addEventListener('pointermove', (ev) => {
        if (!isScrubbing) return;
        seekFromClientX(ev.clientX);
      });

      progress.addEventListener('pointerup', (ev) => {
        if (!isScrubbing) return;
        isScrubbing = false;

        if (progress.releasePointerCapture) {
          try {
            progress.releasePointerCapture(ev.pointerId);
          } catch (e) {}
        }

        if (wasPlayingBeforeScrub) {
          vid.play();
        }

        if (typeof setCursorSolid === 'function') {
          setCursorSolid(false);
        }
      });

      progress.addEventListener('pointerleave', () => {
        if (!isScrubbing && typeof setCursorSolid === 'function') {
          setCursorSolid(false);
        }
      });

      // --- PAUSE / RESTART LOGIC ---
      pauseBtn.addEventListener('click', () => {
        if (vid.paused) {
          vid.play();
          pauseBtn.textContent = '❚❚'; // pause icon
        } else {

          pauseBtn.textContent = '▶'; // play icon

    { key: 'intro',     labelKey: 'projectNavIntro' },
    { key: 'tensions',  labelKey: 'projectNavTensions' },
    { key: 'solutions', labelKey: 'projectNavSolutions' },
    { key: 'results',   labelKey: 'projectNavResults' }
  ];

  projectTopbarButtons = {};

  defs.forEach(def => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'project-topbar-btn';
    btn.dataset.section = def.key;
    btn.textContent = uiStrings[def.labelKey][currentLang] || def.key;

    btn.addEventListener('click', () => {
      if (!currentMode || currentMode === 'global') return;

      const projectIndices = projectSlidesById[currentMode] || [];
      const pos = projectSectionOrder.indexOf(def.key);
      const slideIdx = projectIndices[pos];

      if (slideIdx == null) return;

      const slidesEl = Array.from(scroller.querySelectorAll('.slide'));
      const targetEl = slidesEl[slideIdx];
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      setActiveProjectSection(def.key);
    });

    pill.appendChild(btn);
    projectTopbarButtons[def.key] = btn;

  group.appendChild(backBtn);
  group.appendChild(pill);
  projectTopbarEl.appendChild(group);

      py = lerp(py, ty, 0.25);

 function buildCompetencesDiagram(svgEl, blocks) {
  const svg = d3.select(svgEl);
  svg.selectAll('*').remove(); // clear previous diagram

  const width  = svgEl.clientWidth  || 900;
  const height = svgEl.clientHeight || 520;

  svg
    .attr('viewBox', `0 0 ${width} ${height}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  // -----------------------------
  // NODES & LINKS
  // -----------------------------

  const nodes = [];
  const links = [];

  // create category + item nodes
  blocks.forEach((block, i) => {
    const catId = `cat-${i}`;
    nodes.push({
      id: catId,
      label: block.title || '',
      type: 'category',
      group: i
    });

    (block.items || []).forEach((itemText, j) => {
      const itemId = `item-${i}-${j}`;
      nodes.push({
        id: itemId,
        label: itemText,
        type: 'item',
        group: i,
        parentId: catId
      });

      // link category -> item
      links.push({
        source: catId,
        target: itemId,
        kind: 'cat-item'
      });
    });
  });

  // fully connect categories (each category linked to all others)
  const categoryNodes = nodes.filter(n => n.type === 'category');
  for (let i = 0; i < categoryNodes.length; i++) {
    for (let j = i + 1; j < categoryNodes.length; j++) {
      links.push({
        source: categoryNodes[i].id,
        target: categoryNodes[j].id,
        kind: 'cat-cat'
      });
    }
  }

  // -----------------------------
  // DRAWING
  // -----------------------------

  const link = svg
    .append('g')
    .attr('class', 'skills-diagram-links')
    .selectAll('line')
    .data(links)
    .enter()
    .append('line');

  const nodeLabels = svg
    .append('g')
    .attr('class', 'skills-diagram-nodes')
    .selectAll('text')
    .data(nodes)
    .enter()
    .append('text')
    .attr('class', d =>
      d.type === 'category'
        ? 'skills-diagram-label category'
        : 'skills-diagram-label item'
    )
    .text(d => d.label)
    .each(function (d) {
      d.bbox = this.getBBox(); // capture text size for centering
    });

  // -----------------------------
  // SIMULATION
  // -----------------------------

  // choose where you want to center the diagram (slightly left)
const targetX = width * 0.46;   // 40% of width → more left
const targetY = height * 0.50;  // middle vertically

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links)
    .id(d => d.id)
    .distance(l => l.kind === 'cat-cat' ? 170 : 120)
    .strength(0.9))
  .force('charge', d3.forceManyBody().strength(-260))
  .force('collision', d3.forceCollide().radius(d =>
    d.type === 'category' ? 80 : 60
  ))
  .force('center', d3.forceCenter(targetX, targetY))
  .force('x', d3.forceX(targetX).strength(0.08))
  .force('y', d3.forceY(targetY).strength(0.08));


  simulation.on('tick', () => {
    // connect links to CENTER of text bboxes
    link
      .attr('x1', d => {
        const bbox = d.source.bbox;
        return d.source.x + ((bbox && bbox.width) || 0) / 2;
      })
      .attr('y1', d => {
        const bbox = d.source.bbox;
        return d.source.y - ((bbox && bbox.height) || 0) / 2;
      })
      .attr('x2', d => {
        const bbox = d.target.bbox;
        return d.target.x + ((bbox && bbox.width) || 0) / 2;
      })
      .attr('y2', d => {
        const bbox = d.target.bbox;
        return d.target.y - ((bbox && bbox.height) || 0) / 2;
      });

    nodeLabels
      .attr('x', d => d.x)
      .attr('y', d => {
        // small correction so bottom labels don't stack completely
        if (d.y > height * 0.75) return d.y + 1.2;
        return d.y;
      });
  });

  // optional: let layout settle then freeze for readability
  setTimeout(() => {
    simulation.stop();
  }, 1500);

  // -----------------------------
  // FOCUS / INTERACTIVITY
  // -----------------------------

  function setActiveCategory(catId) {
    const activeGroup = nodes.find(n => n.id === catId)?.group ?? 0;

    // very smooth visual transition
    const tr = d3.transition()
      .duration(420)
      .ease(d3.easeCubicOut);

    // nodes opacity + size
    nodeLabels
      .transition(tr)
      .attr('opacity', d => {
        if (d.type === 'category') {
          return d.id === catId ? 1 : 0.25;
        }
        // items: full if same group, dim otherwise
        return d.group === activeGroup ? 1 : 0.15;
      })
      .attr('font-size', d => {
        if (d.type === 'category') {
          return d.id === catId ? 14 : 12;
        }
        return 11;
      });

    // links opacity + width
    link
      .transition(tr)
      .attr('opacity', l => {
        const s = l.source;
        const tNode = l.target;

        const isActiveCatCat =
          l.kind === 'cat-cat' && (s.id === catId || tNode.id === catId);
        const isActiveCatItem =
          l.kind === 'cat-item' && (s.id === catId || tNode.parentId === catId);

        if (isActiveCatItem) return 0.85;   // strongest: active comp → items
        if (isActiveCatCat)  return 0.45;   // softer: comp ↔ comp
        return 0.10;                        // background links
      })
      .attr('stroke-width', l => {
        const s = l.source;
        const tNode = l.target;

        const isActiveCatCat =
          l.kind === 'cat-cat' && (s.id === catId || tNode.id === catId);
        const isActiveCatItem =
          l.kind === 'cat-item' && (s.id === catId || tNode.parentId === catId);

        if (isActiveCatItem) return 1.6;
        if (isActiveCatCat)  return 1.0;
        return 0.6;
      });

    // no simulation.alpha / no restart → positions stay stable
  }

  // initial active category = first one
  if (categoryNodes.length > 0) {
    setActiveCategory(categoryNodes[0].id);
  }

  // hover logic: hovering a category or one of its items focuses that group
  nodeLabels.on('mouseenter', (event, d) => {
    const catId =
      d.type === 'category'
        ? d.id
        : d.parentId || `cat-${d.group}`;
    setActiveCategory(catId);
  });
}
